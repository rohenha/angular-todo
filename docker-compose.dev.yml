services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
      - "5173:5173"  # Vite HMR
    environment:
      - NODE_ENV=development
      - DATABASE_URL=mongodb://mongo:27017/angular-todo?directConnection=true
      - PORT=3000
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      # Anonymous volume: isolated from host node_modules (native binaries differ).
      # After changing package.json/bun.lock, recreate it:
      #   docker compose -f docker-compose.dev.yml rm -sfv app
      #   docker compose -f docker-compose.dev.yml up -d --build app
      - /app/node_modules
      - /app/.output
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    # Sync deps from the bind-mounted lockfile on every start, then run Vite.
    command: sh -c "bun install --frozen-lockfile && npm run dev -- --host 0.0.0.0"
    stdin_open: true
    tty: true

  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=angular-todo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command:
      - mongosh
      - --host
      - mongo:27017
      - --quiet
      - --eval
      - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }; while (!db.hello().isWritablePrimary) { sleep(200) }"

volumes:
  mongo-data: