services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
      - "5173:5173"  # Vite HMR
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/angular-todo
      - PORT=3000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.output
    depends_on:
      mongo:
        condition: service_healthy
    command: npx vite dev --host 0.0.0.0
    stdin_open: true
    tty: true

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=angular-todo
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mongo-data: